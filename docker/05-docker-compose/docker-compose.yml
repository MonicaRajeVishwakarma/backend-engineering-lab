services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    
  nginx:
    image: nginx
    ports:
      - 8080:80
    depends_on:
      - redis

  redis:
    image: redis
    environment:
      APP_ENV: ${APP_ENV}
    volumes:
      - redis_data:/data


  postgres:
    image: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql  



volumes:
  redis_data:
  postgres_data:
    